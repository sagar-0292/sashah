<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Store preview · Sahaay Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="storefront.css">
<style>
  html,body{margin:0;background:#fff;}
  .pv-bar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;background:#111110;color:rgba(255,255,255,.8);font:500 13px/1.4 Inter,system-ui,sans-serif;padding:9px 16px;text-align:center;}
  .pv-bar b{color:#fff;font-weight:600;}
  .pv-bar a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;}
  .pv-empty{font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:80px 20px;color:#66635D;}
  body.embedded .pv-bar{display:none;}
  body.embedded::-webkit-scrollbar{display:none;}
  body.embedded{scrollbar-width:none;}
</style>
</head>
<body>
<div class="pv-bar" id="pv-bar"></div>
<div id="sf-root"></div>
<script src="sections.js"></script>
<script src="storefront.js"></script>
<script src="presets.js"></script>
<script>
(function () {
  var KEY = 'sahaay-stores:v1';
  var root = document.getElementById('sf-root');
  var bar = document.getElementById('pv-bar');
  var q = new URLSearchParams(location.search);
  var embedded = window.self !== window.top || q.get('embed') === '1';
  if (embedded) document.body.classList.add('embedded');

  var opts = { mode: 'preview', standalone: q.get('app') === '1', forceInstall: q.get('install') === '1', editor: q.get('edit') === '1' };
  // Live editor: tell the builder which section was clicked.
  opts.onSelect = function (id) { if (window.parent !== window) window.parent.postMessage({ type: 'sahaay-select', id: id }, location.origin); };
  var demo = q.get('demo');
  var draft = q.get('draft') === '1';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
  }

  var store, sf;

  if (demo && SahaayPresets.DEMOS[demo]) {
    store = SahaayPresets.DEMOS[demo]();
    bar.innerHTML = '<span>This is a <b>demo store</b> built with Sahaay Stores. Try adding to cart and checking out.</span><a href="index.html#/setup">Build your own, free →</a>';
  } else if (draft) {
    store = null;  // wait for the wizard to post a draft
  } else {
    store = load();
    if (!store) {
      root.innerHTML = '<div class="pv-empty">No store yet. <a href="index.html#/setup">Create your store</a> first.</div>';
      bar.style.display = 'none';
      return;
    }
    bar.innerHTML = '<span><b>Preview</b> · test orders you place here appear in your dashboard.</span><a href="index.html#/admin">Back to dashboard</a>';
    // Test orders go straight into the builder's saved data and reduce stock
    // the same way a real sale would, so owners can try the whole flow.
    opts.onOrder = function (order) {
      var s = load() || store;
      order.test = true;
      s.orders = [order].concat(s.orders || []);
      order.items.forEach(function (it) {
        (s.products || []).forEach(function (p) {
          if (p.id === it.productId && p.stock !== null && p.stock !== '' && p.stock !== undefined) {
            p.stock = Math.max(0, Number(p.stock) - it.qty);
          }
        });
      });
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* quota */ }
      store = s;
      sf.update(s);
      if (window.parent !== window) window.parent.postMessage({ type: 'sahaay-order' }, location.origin);
    };
  }

  function mount() {
    if (!store) return;
    if (!sf) sf = SahaayStorefront.mount(root, store, opts);
    else sf.update(store);
  }
  mount();

  // Live, unsaved edits from the design editor or the setup wizard.
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'sahaay-store') { store = e.data.store; mount(); }
    if (e.data.type === 'sahaay-highlight' && sf) sf.highlight(e.data.id, e.data.scroll !== false);
    if (e.data.type === 'sahaay-page' && sf) sf.showPage(e.data.id);
  });
  // Saved changes from another tab.
  if (!demo && !draft) {
    window.addEventListener('storage', function (e) {
      if (e.key === KEY) { var s = load(); if (s) { store = s; mount(); } }
    });
  }
  if (window.parent !== window) window.parent.postMessage({ type: 'sahaay-preview-ready' }, location.origin);
})();
</script>
</body>
</html>
